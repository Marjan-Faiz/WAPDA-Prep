["Stress types — Normal stress σ = P/A; shear τ = V/A. Hooke’s law holds in the elastic range: σ = Eε. Steel E ≈ 200 GPa, concrete Ec ≈ 4700√f’c MPa.","Bending — σ = My/I. Section modulus Z = I/y. Rectangle I = bh³/12, circle I = πd⁴/64. Max shear in a rectangular section = 1.5 × average.","Buckling — Pcr = π²EI/(KL)²; K = 0.5 fixed-fixed, 0.7 fixed-pinned, 1 pinned-pinned, 2 fixed-free. Slenderness ratio = KL/r.","Torsion and combined stress — Solid shaft τ = Tr/J, J = πd⁴/32. Principal stresses come from Mohr’s circle; max shear = (σ1 − σ2)/2.","Exam tip — Know the standard deflection formulas by heart; they appear in almost every test."],
["Determinacy — Beam/frame: 3m + r − 3j. Degree of indeterminacy above zero means compatibility equations are needed.","Methods — Slope-deflection: M = 2EI/L(2θA + θB − 3ψ) + FEM. Moment distribution: stiffness 4EI/L (far end fixed) or 3EI/L (far end pinned); carry-over factor 0.5.","Fixed-end moments — UDL: wL²/12; central point load: PL/8. Propped cantilever with UDL: max moment wL²/8 at the fixed end.","Influence lines — Müller-Breslau: the ILD of an effect is the deflected shape when that effect is released by a unit displacement. Absolute max moment on a simply supported beam occurs under a load near midspan.","Trusses — Method of joints and sections. A joint with two non-collinear members and no load has both members as zero-force."],
["Materials — Normal grades: f’c 20–35 MPa; steel Grade 60 (fy = 420 MPa). Ec = 4700√f’c MPa.","Beams — Singly reinforced: a = As·fy/(0.85f’c·b); φMn = φAs·fy(d − a/2). Tension-controlled needs εt ≥ 0.005 with φ = 0.9. Min depth of simply supported beam L/16.","Slabs — One-way min thickness L/20 (simply supported), L/24 (one end continuous), L/28 (both), L/10 (cantilever). Shrinkage steel 0.18% for Grade 60. Two-way slabs: direct design or equivalent frame method.","Columns — Tied φ = 0.65, spiral φ = 0.75. Pn,max = 0.80φ[0.85f’c(Ag − Ast) + fy·Ast] for tied. Min 4 bars tied rectangular, 6 spiral; ties at least 10 mm.","Shear and detailing — Vc = 0.17√f’c·bw·d (MPa units). Stirrup max spacing d/2 (not above 600 mm). Development length grows with bar size and fy; lap splice about 1.3 ld."],
["Mix basics — Abrams’ law: strength falls as w/c rises. Typical w/c 0.4–0.6. Nominal mixes 1:2:4 (M15), 1:1.5:3 (M20).","Fresh concrete tests — Slump, compaction factor, Vee-Bee, flow table. Slump about 25–50 mm for roads, 75–100 mm for beams, 100–150 mm for columns.","Hardened concrete tests — Cube 150 mm and cylinder 150×300 mm at 28 days; rebound hammer and UPV are non-destructive; split tensile and flexure tests. 7-day strength is about 65–70% of 28-day.","Cement — OPC compounds: C3S (early strength), C2S (late strength), C3A (heat, flash set), C4AF. Types: sulphate-resisting (low C3A), rapid-hardening, low-heat for dams.","Durability — Adequate cover, low permeability, proper curing, avoid alkali-silica reaction, limit chlorides. Mass concrete uses low-heat cement and fly ash."],
["Index properties — Gs ≈ 2.65 for sand; γd = Gsγw/(1 + e); γsat = (Gs + e)γw/(1 + e). Relative density Dr = (emax − e)/(emax − emin).","Plasticity — LL (Casagrande/cone), PL (3 mm thread), SL. Activity = PI/%clay. On the plasticity chart the A-line separates clay (CL, CH) from silt (ML, MH).","Permeability and seepage — Darcy: v = ki. Constant head test for sands, falling head for clays. Flow net: q = k·H·Nf/Nd. Quick condition when i = icr ≈ 1.","Consolidation — Sc = Cc·H/(1 + e0)·log((σ0 + Δσ)/σ0). Time t = Tv·Hdr²/cv; Tv = 0.848 for 90% consolidation. Normally consolidated: OCR = 1.","Shear strength — Direct shear, triaxial (UU, CU, CD), vane shear for soft clay. Sand: c = 0, φ about 28–40°. Saturated clay undrained: φu = 0, cu = qu/2."],
["Bearing capacity — Terzaghi strip: qu = cNc + qNq + 0.5γBNγ; square 1.3cNc + qNq + 0.4γBNγ; circular 1.3cNc + qNq + 0.3γBNγ. A high water table lowers capacity.","Settlement — Immediate (elastic), primary consolidation, secondary compression. Differential settlement matters more than total settlement for cracking.","Earth pressure — At rest K0 = 1 − sinφ; Ka < K0 < Kp. Active thrust Pa = 0.5Ka·γH². In cohesive soil, tension cracks reach depth 2c/(γ√Ka).","Piles — Capacity = end bearing + skin friction. Static formulas: α-method for clays, β-method for sands. Know group efficiency, negative skin friction, pile load test, driven vs bored piles.","Site investigation — Boreholes, SPT N-value (overburden correction), CPT, plate load test. Borehole depth roughly 1.5B to 2B below foundation level."],
["Fluid statics — Pressure p = γh. Centre of pressure lies below the centroid: h* = h̄ + I/(Ah̄). Buoyancy equals weight of displaced fluid; a floating body is stable if the metacentre is above the centre of gravity.","Pipe flow — Darcy-Weisbach hf = fLV²/(2gD); laminar f = 64/Re. Minor losses K·V²/2g. Series pipes add losses; parallel pipes have equal head loss and share flow.","Open channel — Manning’s n: concrete about 0.013, earth about 0.025. Best hydraulic section: rectangle b = 2y; trapezoid half-hexagon. Critical depth yc = (q²/g)^(1/3) gives minimum specific energy.","Hydraulic jump — Occurs supercritical to subcritical; y2/y1 = 0.5(√(1 + 8Fr1²) − 1). Energy loss = (y2 − y1)³/(4y1y2). Used in stilling basins.","Machines — Pump power P = γQH/η. Turbines: Pelton (high head, impulse), Francis (medium head), Kaplan (low head, large flow)."],
["Precipitation — Mean areal rainfall by arithmetic mean, Thiessen polygon, or isohyetal method (most accurate). IDF curves; return period T = 1/P.","Losses — Infiltration (Horton), evaporation (pan coefficient about 0.7), evapotranspiration. φ-index and W-index separate effective rainfall.","Runoff — Rational method for small catchments: Q = CiA/360. SCS-CN: Q = (P − 0.2S)²/(P + 0.8S). Time of concentration by Kirpich.","Hydrograph — Rising limb, peak, recession. Unit hydrograph assumes linearity and superposition. Base flow separation by straight line.","Groundwater and floods — Aquifers: confined and unconfined. Unconfined well: Q = πK(h2² − h1²)/ln(r2/r1). Flood routing: Muskingum and reservoir routing; flood frequency by Gumbel."],
["Gravity dams — Resist by self-weight. Forces: weight, water pressure, uplift, silt, earthquake, ice. Stability needs FOS ≥ 1.5 against overturning, sliding check, no tension, and resultant within the middle third.","Embankment dams — Earth/rockfill with clay core, filters and drains. Failure causes: overtopping, piping, slope slip. Tarbela is the major earth/rockfill dam on the Indus; Mangla is on the Jhelum.","Spillways and outlets — Ogee, chute, side-channel, siphon. Energy dissipation by stilling basin or flip bucket. Gates: radial (Tainter) and vertical lift. Keep freeboard above max flood level.","Hydropower — P = ρgQHη. Run-of-river vs storage plants. Parts: intake, penstock, surge tank (reduces water hammer), powerhouse, tailrace. Load factor and plant factor.","Pakistan context — Large dams and barrages: Tarbela, Mangla, Warsak, Chashma, Ghazi Barotha. Newer: Diamer-Bhasha (RCC), Mohmand, Dasu. Indus Waters Treaty 1960 divides the six rivers. Check latest capacities in current news."],
["Highway geometry — SSD = 0.278Vt + V²/(254(f ± G)). Overtaking sight distance is larger than SSD. Horizontal curve: R = V²/(127(e + f)); use transition curves and extra widening on sharp curves.","Traffic — Flow q = k·v. PCU converts vehicle types. Design hour volume and level of service A–F. Lane capacity about 1800–2000 pcu/hr.","Pavement design — Flexible: surface, base, subbase, subgrade; designed by CBR or AASHTO using ESAL. Rigid: slab with joints (contraction, expansion), dowels and tie bars.","Materials — Aggregate tests: Los Angeles abrasion, impact, crushing, flakiness. Bitumen: penetration (60/70 grade), softening point, ductility, flash point. Marshall stability, flow, air voids.","Maintenance — Distresses: rutting, fatigue cracking, bleeding, potholes, faulting. Remedies: overlay, crack sealing, slurry seal."],
["Levelling — RL = HI − FS, where HI = RL of benchmark + BS. Check: ΣBS − ΣFS = last RL − first RL. Curvature and refraction correction = 0.0673D² (D in km, result in m).","Angular measurement — Theodolite: averaging face left and face right removes instrumental errors. Interior angles sum to (2n − 4) × 90°.","Traverse adjustment — Bowditch rule: correction proportional to leg length. Departure = L sinθ, latitude = L cosθ. Closing error = √(ΣL² + ΣD²).","Curves and areas — Simple curve: T = R tan(Δ/2), L = RΔ (radians), chord C = 2R sin(Δ/2). Areas by coordinates, trapezoidal rule, Simpson’s rule.","Modern methods — Total station, GNSS/GPS, LiDAR, drone photogrammetry; know contour interval and scale basics."],
["Quantity estimation — Long-wall short-wall and centre-line methods. Units: earthwork m³, plaster m², RCC m³, steel kg. Bar weight = d²/162 kg/m (d in mm).","Rate analysis — Rate = material + labour + equipment + overhead + profit. Use current schedule of rates and market rates; contingency commonly 3–5%.","Scheduling — Forward pass gives ES/EF, backward pass LS/LF; total float = LS − ES. Critical path has zero float. Crashing reduces duration at extra cost.","Project management — Gantt chart, resource levelling, earned value: CPI = EV/AC, SPI = EV/PV. Contracts: lump sum, unit rate, cost plus, EPC. Know PEC and tendering basics.","Safety and quality — Site safety, PPE, scaffolding checks, QA/QC inspections and testing frequency."],
["Water demand — Domestic about 135–200 litres per capita per day, plus fire, industrial and losses. Peak factor about 1.5–2.5 times average.","Treatment — Coagulation with alum, flocculation, sedimentation (overflow rate), rapid sand filtration, chlorination (residual about 0.2–0.5 mg/L). Hardness removed by lime-soda process.","Wastewater — Separate and combined sewers; minimum self-cleansing velocity about 0.6 m/s. Treatment: primary, secondary (activated sludge, trickling filter), tertiary. BOD5 measured at 20 °C.","Pollution and EIA — Air quality, solid waste management, noise limits. EIA is required for major projects such as dams, with mitigation and monitoring plans.","Quick numbers — Drinking water pH 6.5–8.5; TDS under 1000 mg/L; turbidity guideline is about 1 NTU (5 NTU acceptable limit)."],
["Grammar core — Use present perfect for unfinished past actions. ‘Each, every, either, neither’ take singular verbs. Conditionals: if + present, will; if + past, would.","Vocabulary — Learn 20 words daily with usage. Frequent: ameliorate (improve), mitigate (lessen), ubiquitous (everywhere), ambiguous (unclear).","Common errors — Between two, among many; fewer for count, less for amount. Watch prepositions: agree with, differ from, prefer to. Avoid double negatives.","Comprehension and writing — Read the passage, find the main idea, then answer. For letters and applications keep correct format, tone and brevity.","Practice — One passage, 10 error-spotting and 10 synonym questions daily."],
["Freedom movement — 1857 war, Sir Syed and Aligarh, Muslim League 1906 (Dhaka), Lucknow Pact 1916, Nehru Report 1928, Jinnah’s 14 Points 1929, Allahabad address 1930, Lahore Resolution 1940, Cabinet Mission 1946, independence 1947.","Constitutional history — Government of India Act 1935 adapted at first; Objectives Resolution 1949; constitutions of 1956, 1962, 1973. The 1973 constitution is parliamentary and bicameral; 18th Amendment (2010) increased provincial autonomy.","Geography — Provinces: Punjab, Sindh, KPK, Balochistan; plus GB and AJK. Rivers: Indus, Jhelum, Chenab, Ravi, Sutlej, Kabul. K2 is the highest peak. Karakoram Highway links Pakistan and China.","Economy and resources — Agriculture is a major employer: cotton, wheat, rice, sugarcane. Energy mix: hydropower, thermal, nuclear, renewables. CPEC includes Gwadar port.","Key personalities — Allama Iqbal, Quaid-e-Azam, Liaquat Ali Khan, Fatima Jinnah, Sir Syed Ahmad Khan."],
["Beliefs and pillars — Tawheed, Risalat, Akhirah. Pillars: Shahada, Salah, Zakat (2.5%), Sawm, Hajj. Revelation lasted about 23 years; first revelation was in Ghar-e-Hira.","Seerah — Birth in Makkah 570 CE; Hijra 622 CE; Badr (2 AH), Uhud (3 AH), Khandaq (5 AH), Hudaybiyyah (6 AH), Conquest of Makkah (8 AH), Farewell Hajj (10 AH).","Caliphate — Abu Bakr, Umar, Uthman, Ali (RA), in order. Umar introduced the Hijri calendar and diwan; Uthman compiled the standard mushaf.","Islamic law — Sources: Quran, Sunnah, Ijma, Qiyas. Four Sunni schools: Hanafi, Maliki, Shafi’i, Hanbali. Revise basic rules of zakat and inheritance.","Social teachings — Honesty, justice, rights of neighbours, trade without riba, equality, tolerance."],
["About WAPDA — Created 1958 to develop water and power resources; HQ in Lahore. Distribution and thermal generation were later unbundled into DISCOs and GENCOs; WAPDA now mainly runs hydropower and water projects.","Projects — Tarbela, Mangla, Warsak, Ghazi Barotha, Neelum-Jhelum, Tarbela extensions, Diamer-Bhasha and Mohmand dams. Learn installed capacities from the latest official WAPDA data.","Energy sector terms — Installed vs generation capacity, circular debt, NEPRA (regulator), NTDC, DISCOs, IPPs, net metering, renewable policy.","Daily habit — Read 15 minutes of national and economic news; note budget, appointments, treaties, awards and science events in a small notebook.","Last week — Re-read your notes and attempt a current affairs mock covering the last six months."],
["Arithmetic — Percentage change = (new − old)/old × 100. Average = sum/count; simple interest I = PRT/100; compound A = P(1 + r/n)^(nt).","Speed and work — Distance = speed × time; km/h to m/s multiply by 5/18. Work: 1/a + 1/b = 1/t. Pipes and cisterns follow the same rule; trains use relative speed.","Algebra and geometry — (a + b)² = a² + 2ab + b²; quadratic x = (−b ± √(b² − 4ac))/2a. Triangle ½bh, circle πr², cylinder volume πr²h, Pythagoras a² + b² = c².","Reasoning — Number and letter series, analogies, coding-decoding, blood relations, directions, syllogisms. Practise under a timer.","Strategy — Solve easy questions first and skip long ones; check the advertisement for negative marking."]

function plan0(d){
 var a=(2*(d-1))%N,b=(2*(d-1)+1)%N,r=Math.floor((2*(d-1))/N)+1,L=[];
 if(d>=57){L.push({id:d+"r1",t:"Final revision: read all Civil notes once",tp:null});L.push({id:d+"r2",t:"Final revision: WAPDA, Pakistan Studies, English, Math",tp:null});L.push({id:d+"m",t:"Full-length mock (100 MCQs, timed) + review every mistake",tp:null});return L}
 L.push({id:d+"a",t:"Learn: "+T[a][0],tp:a});L.push({id:d+"b",t:"Learn: "+T[b][0],tp:b});
 if(d>1){var p=(2*(d-2))%N;L.push({id:d+"v",t:"Revise yesterday: "+T[p][0],tp:p})}
 L.push({id:d+"q",t:d%7==0?"Weekly mock: 50 MCQs timed + log mistakes":"Practice 25 MCQs on today’s topics",tp:null});
 return L}
function pct(d){var p=plan(d),n=0;p.forEach(function(x){if(S.done[x.id])n++});return n/p.length}
function streak(){var s=0,d=dn();if(pct(d)<1)d--;while(d>=1&&pct(d)==1){s++;d--}return s}
function hrs(){var m=0;for(var k in S.min)m+=S.min[k];return m}
function topicCount(i){var c=0;for(var d=1;d<=DAYS;d++)plan(d).forEach(function(x){if(x.tp===i&&S.done[x.id])c++});return c}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(){
 document.getElementById("hd").textContent="Day "+dn()+" of "+DAYS+" · "+(DAYS-dn())+" days left · started "+S.start;
 var h="";
 if(view=="today"){
  var p=plan(cur),done=p.filter(function(x){return S.done[x.id]}).length;
  h+='<div class="card"><div class="row"><button class="b" id="pv">◀</button><h2 style="flex:2;text-align:center;margin:0">Day '+cur+(cur==dn()?' (today)':'')+'</h2><button class="b" id="nx">▶</button></div>';
  h+='<div class="bar" style="margin:10px 0"><i style="width:'+done/p.length*100+'%"></i></div><div class="mu">'+done+' of '+p.length+' tasks done</div></div><div class="card">';
  p.forEach(function(x){h+='<label class="t'+(S.done[x.id]?' d':'')+'"><input type="checkbox" data-id="'+x.id+'"'+(S.done[x.id]?' checked':'')+'><span>'+esc(x.t)+(x.tp!=null?'<span class="tag">'+T[x.tp][1]+'</span>':'')+'</span></label>'});
  h+='</div>';
  var seen={};p.forEach(function(x){if(x.tp!=null&&!seen[x.tp]){seen[x.tp]=1;h+='<div class="card"><h2>'+T[x.tp][0]+'</h2><ul>'+T[x.tp].slice(2).map(function(n){return'<li>'+esc(n)+'</li>'}).join("")+'</ul>'+det(x.tp)+'</div>'}});
  p.forEach(function(x){if(x.ai!=null&&S.ai[x.ai])h+=aiCard(x.ai)});
  h+='<div class="card"><h2>Aaj kya parhna hai?</h2><div class="row"><input type="text" id="aq" placeholder="e.g. Consolidation of soil" style="flex:1;min-width:150px;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px"><button class="b p" id="ask" style="flex:none">Get notes</button></div><div class="mu" id="as" style="margin-top:6px">Type any topic. Notes are made for the WAPDA test with Pakistan standards, added to today as a task, and saved in My Notes.</div></div>';
  h+='<div class="card"><h2>Study time today</h2><div class="row"><input type="number" id="mn" min="0" step="15" placeholder="minutes" value="'+(S.min[cur]||"")+'"><span class="mu">minutes studied</span></div></div>';
  h+='<div class="card"><h2>Weak points / mistakes</h2><textarea id="nt" placeholder="Write what you got wrong or found hard">'+esc(S.notes[cur]||"")+'</textarea></div>';
 }else if(view=="mine"){
  if(!S.ai.length)h+='<div class="card mu">No saved notes yet. Ask for a topic in the Today tab.</div>';
  for(var i=S.ai.length-1;i>=0;i--)h+=aiCard(i);
 }else if(view=="topics"){
  T.forEach(function(t,i){var c=S.conf[i]||0;h+='<div class="card"><details><summary>'+t[0]+'<span class="tag">'+t[1]+'</span></summary><ul>'+t.slice(2).map(function(n){return'<li>'+esc(n)+'</li>'}).join("")+'</ul>'+det(i)+'<div class="row mu">Confidence: '+[1,2,3].map(function(k){return'<button class="b'+(c==k?' p':'')+'" style="flex:none;padding:4px 12px" data-c="'+i+'_'+k+'">'+["Weak","OK","Strong"][k-1]+'</button>'}).join("")+'</div></details></div>'});
  h+='<p class="mu">Key points are quick-revision notes. Check numbers and syllabus against the official WAPDA advertisement for your post.</p>';
 }else{
  var tot=0,dn_=0;for(var d=1;d<=DAYS;d++){var q=plan(d);tot+=q.length;q.forEach(function(x){if(S.done[x.id])dn_++})}
  h+='<div class="g"><div class="card"><b>'+Math.round(dn_/tot*100)+'%</b><span class="mu">overall</span></div><div class="card"><b>'+streak()+'</b><span class="mu">day streak</span></div><div class="card"><b>'+(hrs()/60).toFixed(1)+'</b><span class="mu">hours</span></div></div>';
  h+='<div class="card"><h2>By topic (times studied)</h2>';
  T.forEach(function(t,i){var c=topicCount(i),mx=Math.max(1,Math.round(DAYS*2/N));h+='<div style="margin:8px 0"><div class="row mu" style="justify-content:space-between"><span>'+t[0]+'</span><span>'+c+'×'+(S.conf[i]?' · '+["Weak","OK","Strong"][S.conf[i]-1]:'')+'</span></div><div class="bar"><i style="width:'+Math.min(100,c/mx*100)+'%"></i></div></div>'});
  h+='</div><div class="card"><h2>Settings</h2><div class="row"><span class="mu">Start date</span><input type="date" id="sd" value="'+S.start+'"></div></div>';
 }
 document.getElementById("app").innerHTML=h;
 document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v==view)});
}
document.querySelector("nav").onclick=function(e){if(e.target.dataset.v){view=e.target.dataset.v;render()}};
var A=document.getElementById("app");
A.onclick=function(e){var t=e.target;
 if(t.id=="pv"&&cur>1){cur--;render()}
 if(t.id=="nx"&&cur<DAYS){cur++;render()}
 if(t.id=="ask")ask();
 if(t.dataset.c){var a=t.dataset.c.split("_");S.conf[a[0]]=+a[1];save();render()}};
A.onchange=function(e){var t=e.target;
 if(t.dataset.id){S.done[t.dataset.id]=t.checked;save();render()}
 if(t.id=="mn"){S.min[cur]=+t.value||0;save()}
 if(t.id=="sd"&&t.value){S.start=t.value;save();cur=dn();render()}};
A.oninput=function(e){if(e.target.id=="nt"){S.notes[cur]=e.target.value;save()}};
render();
</script></body></html>
